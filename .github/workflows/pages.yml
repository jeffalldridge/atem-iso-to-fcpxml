name: Deploy website
on:
  push:
    branches: [main]
    paths: ["docs/site/**", "tests/test_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # A manual run from another branch must not replace the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Check metadata, schema, links and social image
        run: python3 -m unittest discover -s tests -p test_site.py -v
      - run: |
          mkdir -p _site
          cp -R docs/site/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
