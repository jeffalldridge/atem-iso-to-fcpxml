name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile atem_iso_to_fcpxml.py scripts/build_quick_action.py
      - name: Quick Action bundle matches the converter
        run: python scripts/build_quick_action.py --check

  native-app:
    name: Build native Mac app
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check audio inclusion combinations
        run: |
          xcrun swiftc macos/AudioSelection.swift macos/AudioSelectionTests.swift -o /tmp/atem-audio-tests
          /tmp/atem-audio-tests
      - run: python -m pip install -r scripts/requirements-macos-build.txt
      - run: python scripts/build_macos_app.py --bundle-python
      - name: Exercise bundled engine
        run: ATEM_TEST_ENGINE="$PWD/build/ATEM ISO to FCPXML.app/Contents/Resources/atem-engine/atem-engine" python -m unittest discover -s tests -p test_macos_bridge.py -v
      - run: python scripts/package_macos_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error
