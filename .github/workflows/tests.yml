name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile atem_iso_to_fcpxml.py scripts/build_quick_action.py
      - name: Quick Action bundle matches the converter
        run: python scripts/build_quick_action.py --check

  mac-app:
    name: Swift engine parity and app bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify the runner's Xcode toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          major=$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')
          [[ "$major" -ge 26 ]] || { echo "::error::Xcode 26 or newer is required for Icon Composer assets"; exit 1; }

      - name: Swift tests (includes byte-for-byte parity with the Python converter)
        run: swift test
      - name: Assemble the universal app (ad-hoc signed)
        run: make app
      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP="build/ATEM ISO to FCPXML.app"
          codesign --verify --deep --strict --verbose=1 "$APP"
          lipo -archs "$APP/Contents/MacOS/ATEMISOtoFCPXML" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/ATEMISOtoFCPXML" | grep -q x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$(python -c 'import atem_iso_to_fcpxml as m; print(m.__version__)')"
