name: Release

# Push a tag like v1.1.0 to build the universal, notarized, stapled app, package it as a
# notarized .dmg, and publish a GitHub Release together with the Quick Action and the
# standalone Python converter.
#
# Required repository secrets (the same names as macSubtitleOCR-gui, so one set of
# values serves both projects):
#
#   MACOS_CERT_P12          base64-encoded Developer ID Application .p12
#   MACOS_CERT_PASSWORD     password used when exporting the .p12
#   KEYCHAIN_PASSWORD       any random string (for the runner's keychain)
#   DEV_ID                  e.g. "Developer ID Application: Tent Studios, LLC (TEAMID)"
#   NOTARY_KEY              base64-encoded App Store Connect API .p8
#   NOTARY_KEY_ID           10-character Key ID
#   NOTARY_ISSUER_ID        Issuer UUID

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Select Xcode 26 (the macOS 26 SDK, for the Liquid Glass code paths)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || \
            sudo xcode-select -s /Applications/Xcode_26.5.app || \
            sudo xcode-select -s /Applications/Xcode_26.4.1.app
          swift --version
          xcodebuild -version

      - name: Check the tag matches the version everywhere
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          python=$(python -c 'import atem_iso_to_fcpxml as m; print(m.__version__)')
          swift=$(grep -o 'converterVersion = "[^"]*"' Sources/ATEMConverter/FCPXML.swift | cut -d'"' -f2)
          for v in "$plist" "$python" "$swift"; do
            [[ "$v" == "$tag" ]] || { echo "::error::Tag v$tag does not match version $v" >&2; exit 1; }
          done

      - name: Tests
        run: |
          python -m unittest discover -s tests
          python scripts/build_quick_action.py --check
          swift test

      - name: Check for signing secrets
        id: secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [[ -n "$MACOS_CERT_P12" && -n "$NOTARY_KEY" ]]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured; nothing was published. Add the secrets listed at the top of release.yml, or publish a locally notarized build with gh release create."
          fi

      - name: Import Developer ID certificate
        if: steps.secrets.outputs.signing == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERT_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -f "$CERT_PATH"

      - name: Save notarytool credentials
        if: steps.secrets.outputs.signing == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_KEY" | base64 --decode -o "$KEY_PATH"
          xcrun notarytool store-credentials "atem-iso-to-fcpxml" --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f "$KEY_PATH"

      - name: Build, sign, notarize, package, notarize the dmg
        if: steps.secrets.outputs.signing == 'true'
        env:
          DEV_ID: ${{ secrets.DEV_ID }}
        run: make release

      - name: Quick Action and checksums
        if: steps.secrets.outputs.signing == 'true'
        run: |
          set -euo pipefail
          python scripts/build_quick_action.py --zip build/ATEM-ISO-to-FCPXML-Quick-Action.zip
          cp atem_iso_to_fcpxml.py build/
          cd build
          shasum -a 256 ATEM-ISO-to-FCPXML.dmg ATEM-ISO-to-FCPXML-Quick-Action.zip atem_iso_to_fcpxml.py > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: steps.secrets.outputs.signing == 'true'
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          name: ATEM ISO to FCPXML ${{ github.ref_name }}
          files: |
            build/ATEM-ISO-to-FCPXML.dmg
            build/ATEM-ISO-to-FCPXML-Quick-Action.zip
            build/atem_iso_to_fcpxml.py
            build/SHA256SUMS.txt
