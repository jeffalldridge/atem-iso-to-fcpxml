name: Release

# Push a tag like v1.1.0 (on a commit that is on main) to build the universal, notarized,
# stapled app, package it as a notarized .dmg, and create a DRAFT GitHub Release together with
# the Quick Action and the standalone Python converter. Nothing becomes public or "latest"
# until the maintainer checks the draft (see docs/releasing.md) and presses Publish.
#
# Two jobs: "build" holds the signing credentials and can only read the repository; "publish"
# holds contents: write, never sees a credential, and only handles the finished files.
#
# Required secrets (Settings -> Secrets and variables -> Actions), with the same names and values as
# macSubtitleOCR-gui, so one set serves both projects. They may also live in the "release" environment:
#
#   MACOS_CERT_P12          base64-encoded Developer ID Application .p12 (certificate and key)
#   MACOS_CERT_PASSWORD     password used when exporting the .p12
#   DEV_ID                  e.g. "Developer ID Application: Tent Studios, LLC (TEAMID)"
#   NOTARY_KEY              base64-encoded App Store Connect API .p8
#   NOTARY_KEY_ID           10-character Key ID
#   NOTARY_ISSUER_ID        Issuer UUID
#   SPARKLE_PRIVATE_KEY     dedicated Ed25519 update-signing key
#
# The runner's keychain password is generated inside the job and never stored.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, sign, and notarize
    runs-on: macos-26
    timeout-minutes: 60
    # Lets the maintainer add protection rules (for example a required reviewer) to the release credentials.
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify the runner's Xcode toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          major=$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')
          [[ "$major" -ge 26 ]] || { echo "::error::Xcode 26 or newer is required for Icon Composer assets"; exit 1; }

      - name: Check the tag matches the version everywhere
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "::error::Select a version tag for a release"; exit 1; }
          python scripts/check_release.py "$GITHUB_REF_NAME"

      - name: Check the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main only"
            exit 1
          }

      - name: Tests
        run: |
          python -m unittest discover -s tests
          python scripts/build_quick_action.py --check
          swift test

      - name: Require signing and notarization credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEV_ID: ${{ secrets.DEV_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD DEV_ID NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Missing release secret: $name"; exit 1; }
          done

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERT_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -f "$CERT_PATH"

      - name: Save notarytool credentials
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_KEY" | base64 --decode -o "$KEY_PATH"
          xcrun notarytool store-credentials "atem-iso-to-fcpxml" --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f "$KEY_PATH"

      - name: Build, sign, notarize, package, notarize the dmg
        env:
          DEV_ID: ${{ secrets.DEV_ID }}
        run: make release

      - name: Sign the GitHub update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "::error::SPARKLE_PRIVATE_KEY is required"; exit 1; }
          python scripts/build_appcast.py

      - name: Quick Action and checksums
        run: |
          set -euo pipefail
          python scripts/build_quick_action.py --zip build/ATEM-ISO-to-FCPXML-Quick-Action.zip
          cp atem_iso_to_fcpxml.py build/
          cd build
          shasum -a 256 ATEM-ISO-to-FCPXML.dmg ATEM-ISO-to-FCPXML-Quick-Action.zip atem_iso_to_fcpxml.py appcast.xml > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Verify the signed app and disk image
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" build/ATEM-ISO-to-FCPXML.dmg
          spctl -a -t exec -vv "$RUNNER_TEMP/dmg/ATEM ISO to FCPXML.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          spctl -a -t open --context context:primary-signature -vv build/ATEM-ISO-to-FCPXML.dmg
          xcrun stapler validate build/ATEM-ISO-to-FCPXML.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          if-no-files-found: error
          path: |
            build/ATEM-ISO-to-FCPXML.dmg
            build/ATEM-ISO-to-FCPXML-Quick-Action.zip
            build/atem_iso_to_fcpxml.py
            build/SHA256SUMS.txt
            build/appcast.xml

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [[ -f "$RUNNER_TEMP/build.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          fi

  publish:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: files
      - name: Check the files, then create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "::error::Only a version tag can create a release"; exit 1; }
          cd files
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "ATEM ISO to FCPXML $GITHUB_REF_NAME" \
            ATEM-ISO-to-FCPXML.dmg ATEM-ISO-to-FCPXML-Quick-Action.zip atem_iso_to_fcpxml.py SHA256SUMS.txt appcast.xml
