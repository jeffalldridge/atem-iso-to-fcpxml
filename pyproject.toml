[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atem-iso-to-fcpxml"
version = "1.0.1"
description = "Convert Blackmagic ATEM Mini ISO recordings (.drp) to Final Cut Pro multicam FCPXML with the live switch rebuilt and uncompressed WAV audio."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jeff Alldridge"}]
keywords = ["atem", "atem-mini", "blackmagic", "final-cut-pro", "fcpxml", "multicam", "drp", "iso-recording", "live-switching", "church"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: MacOS :: MacOS X", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Video :: Non-Linear Editor"]
dependencies = []

[project.urls]
Homepage = "https://jeffalldridge.github.io/atem-iso-to-fcpxml/"
Repository = "https://github.com/jeffalldridge/atem-iso-to-fcpxml"
Issues = "https://github.com/jeffalldridge/atem-iso-to-fcpxml/issues"

[project.scripts]
atem-iso-to-fcpxml = "atem_iso_to_fcpxml:main"

[tool.setuptools]
py-modules = ["atem_iso_to_fcpxml"]
