# Product facts used by the Tent Studios project listing.
# This is a partial fact sheet; expand it from code and vendor evidence as needed.
name: ATEM ISO to FCPXML
quality_finishing:
  benefit: Polish a livestream recording for later publication, keeping the live cuts and finishing from the separate camera ISO recordings.
  implementation:
    file: atem_iso_to_fcpxml.py
    symbols: [make_plan, build_fcpxml]
    behavior: Camera angles reference camera ISO MP4s; Live Edit mc-clips select those angles using the recorded switching decisions. Media is referenced without transcoding.
  vendor:
    model: ATEM Mini Pro ISO
    checked: 2026-10-21
    source: https://www.blackmagicdesign.com/products/atemmini/techspecs
    iso_recording: H.264 camera ISO inputs, up to 70 Mb/s.
    program_recording: H.264 program output at the selected streaming quality setting.
  qualification: ISO recordings can provide a higher-quality finishing source when the program recording uses a lower streaming quality setting. Actual bitrates vary; 70 Mb/s is a maximum, not a fixed recording rate or a converter speed.
  limits:
    - The converter does not upscale or restore detail to the program recording.
    - Sections using Program as a stand-in retain the quality of that program file.

session_selection:
  version: 1.4.0
  implementation:
    python: [load_sessions, load_drp, open_recording, make_plan]
    swift: [loadSessions, openRecording, ConversionModel.open, ConversionModel.chooseSession]
  behavior: Choose one appended recording by start time and duration; Change Session opens another. Default XML filenames and Final Cut event names include the session number.
  matching: Numbered camera and Program files and matching-session WAVs are checked against the selected source clock. Ambiguous sources are rejected.
  evidence: Both sessions of one real ATEM Mini Pro ISO 1080p60 recording passed Final Cut Pro 12.4 import and XML round trips.
  limits: Other naming conventions, hardware, and long-duration lip sync remain unverified.
updates:
  since: 1.3.0
  implementation: Sources/ATEMISOtoFCPXML/AppUpdater.swift
  behavior: Check for Updates and optional automatic installation from signed GitHub Releases; conversion remains offline.
